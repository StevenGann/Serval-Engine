name: Set up GBA build environment
description: Installs CMake, Ninja, the ARM GNU toolchain, mgba-rom-test and mmutil.

inputs:
  gcc-release:
    description: ARM GNU Toolchain release. Keep serval.json's toolchain.gcc and tools/setup-dev.sh in sync.
    default: "15.3.Rel1"
  mgba-version:
    description: mGBA version to build mgba-rom-test from. Keep tools/setup-dev.sh in sync.
    default: "0.10.5"

runs:
  using: composite
  steps:
    - name: Install CMake and Ninja
      uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9  # v4.4.4

    - name: Install ARM GNU Toolchain ${{ inputs.gcc-release }}
      uses: carlosperate/arm-none-eabi-gcc-action@0edbb000a5a98e2292b051b463bff6f512547118  # v1.14.0
      with:
        release: ${{ inputs.gcc-release }}

    - name: Restore mgba-rom-test
      id: mgba-cache
      uses: actions/cache@v6
      with:
        path: ~/mgba-rom-test
        key: mgba-rom-test-${{ inputs.mgba-version }}-${{ runner.os }}-${{ hashFiles('tools/build-mgba-rom-test.sh') }}

    - name: Build mgba-rom-test
      if: steps.mgba-cache.outputs.cache-hit != 'true'
      shell: bash
      run: tools/build-mgba-rom-test.sh ~/mgba-rom-test "${{ inputs.mgba-version }}"

    - name: Expose mgba-rom-test to CMake
      shell: bash
      run: echo "MGBA_ROM_TEST_DIR=$HOME/mgba-rom-test" >> "$GITHUB_ENV"

    - name: Set up mmutil
      uses: ./.github/actions/setup-mmutil
