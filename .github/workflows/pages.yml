name: Pages

# Builds the documentation site (tools/site/build.py: the docs as pages, the
# examples gallery with every example running in the browser, the front page),
# indexes the docs for search with Pagefind and deploys it to GitHub Pages
# (Settings > Pages > Source: GitHub Actions). See docs/development.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one
# that is already deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.11 # keep tools/setup-dev.sh and ci.yml in sync

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/site/requirements.txt

      # The jukebox example's sound bank.
      - uses: ./.github/actions/setup-mmutil

      - name: Build the examples for the web
        run: |
          cmake --preset web-release
          cmake --build --preset web-release

      - name: Install the site's requirements
        run: |
          python -m venv build/site-venv
          build/site-venv/bin/pip install -r tools/site/requirements.txt

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Takes each example's thumbnail in the runner's Chrome
      # (tools/web-shots.py), and fails on any broken local link or anchor.
      - name: Build the site
        run: >-
          build/site-venv/bin/python tools/site/build.py --out build/site
          --web-build build/web-release/examples --base-url "${{ steps.pages.outputs.base_url }}/"

      - name: Index the docs for search
        run: build/site-venv/bin/python -m pagefind --site build/site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
