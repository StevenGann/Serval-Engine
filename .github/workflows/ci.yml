name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the whole CI on the tagged commit before releasing.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install clang-format
        run: pipx install clang-format==18.1.8

      - name: Check formatting
        run: git ls-files '*.c' '*.h' ':!:third_party/**' | xargs clang-format --dry-run --Werror

  host:
    name: Host tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Configure
        run: cmake --preset host

      - name: Build
        run: cmake --build --preset host

      # The Lua compiler's differential test (CTest svlua_difftest) runs
      # programs under real Lua built with 32-bit integers.
      - name: Restore Lua 5.4 with 32-bit integers
        id: lua32-cache
        uses: actions/cache@v6
        with:
          path: ~/lua-5.4.8-32
          key: lua32-${{ runner.os }}-${{ hashFiles('tools/build-lua32.sh') }}

      - name: Build Lua 5.4 with 32-bit integers
        if: steps.lua32-cache.outputs.cache-hit != 'true'
        run: tools/build-lua32.sh ~/lua-5.4.8-32 # downloads and checks lua.org's SHA-256

      - name: Test (AddressSanitizer + UBSan; Lua differential test)
        run: SERVAL_LUA32="$HOME/lua-5.4.8-32/bin/lua" ctest --preset host

  web:
    name: Web build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.11 # keep tools/setup-dev.sh and pages.yml in sync

      - name: Configure
        run: cmake --preset web

      - name: Build
        run: cmake --build --preset web

      # Each example must boot, run and draw in a real browser (the runner's
      # Chrome), and each page must be self-contained: no file it loads.
      - name: Run every example headless
        run: |
          for page in build/web/examples/*.html; do
            case "$page" in *_bench.html) continue ;; esac
            if grep -aEq '<script[^>]+src=|\.wasm"' "$page"; then
              echo "$page loads other files"; exit 1
            fi
            tools/web-shots.py --require-picture "$page" 300 "${page%.html}" shot=300
          done

      - name: Build a game for the web against the release archive
        run: |
          tools/package-release.sh dist
          tools/check-consumer-web.sh dist/serval-engine-*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: build/web/examples/*.html
          if-no-files-found: error

  gba:
    name: GBA build and ROM tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-gba

      - name: Configure
        run: cmake --preset gba-ci

      - name: Build
        run: cmake --build --preset gba-ci

      - name: Run test ROM in mGBA
        run: ctest --preset gba-ci

      - name: Check the release archive builds on its own
        run: |
          tools/package-release.sh dist
          mkdir package-check
          python3 -m zipfile -e dist/serval-engine-*.zip package-check
          cd package-check/serval-engine-*
          cmake --preset gba-release
          cmake --build --preset gba-release

      - name: Build a game against the release archive and run it in mGBA
        run: tools/check-consumer.sh dist/serval-engine-*.zip

      # Release builds compile out the debug checks (SERVAL_DEBUG), so they get
      # their own warnings-as-errors pass and test run; the gba-release build
      # tree is then reused by build-all.sh and bench.sh.
      - name: Build and test release with warnings as errors
        run: |
          cmake --preset gba-release -DSERVAL_WARNINGS_AS_ERRORS=ON -DSERVAL_REQUIRE_ROM_TESTS=ON
          cmake --build --preset gba-release
          ctest --preset gba-release

      # Debug builds are unoptimized (-O0), which changes code size, IWRAM use
      # and what GCC inlines.
      - name: Build and test debug with warnings as errors
        run: |
          cmake --preset gba-debug -DSERVAL_WARNINGS_AS_ERRORS=ON -DSERVAL_REQUIRE_ROM_TESTS=ON
          cmake --build --preset gba-debug
          ctest --preset gba-debug

      - name: Build every example
        run: examples/build-all.sh

      - name: Benchmark (bunnymark)
        run: tools/bench.sh

      - uses: actions/upload-artifact@v7
        with:
          name: roms
          path: |
            examples/roms/*.gba
            build/gba-ci/tests/*.gba
          if-no-files-found: error
